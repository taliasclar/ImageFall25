<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CandyLand</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-asset-item id="model1" src="assets/lollipop.glb"></a-asset-item>
        <a-asset-item id="model2" src="assets/sweets_pack.glb"></a-asset-item>
        <img id="background" src="assets/Background.jpg">
      </a-assets>

      <!-- LOLLIPOP: ROTATION -->
      <a-entity gltf-model="#model1"
                position="-2 1.2 -4"
                scale="1.5 1.5 1.5"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; easing: linear">
      </a-entity>

      <!-- SWEETS PACK: UP/DOWN BOB -->
      <a-entity gltf-model="#model2"
                position="2 1.2 -4"
                scale="8 8 8"
                animation="property: position; dir: alternate; to: 2 1.8 -4; loop: true; dur: 3000">
      </a-entity>

      <!-- SKY BACKGROUND -->
      <a-sky src="#background" radius="30"></a-sky>

    </a-scene>
  </body>
</html>
